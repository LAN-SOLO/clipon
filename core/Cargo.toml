[package]
name = "clipon-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "clipon core: clipboard history model, encrypted store, snippets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = { version = "0.10", features = ["std"] }
